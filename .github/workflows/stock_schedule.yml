name: Stock Prediction & Verification Schedule

on:
  schedule:
    # 日本時間 月曜日 朝7:00 (UTC 日曜日 22:00)
    - cron: '0 22 * * 0'
  workflow_dispatch:

jobs:
  run-tasks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Prediction Script
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: |
          echo "Running Monday morning prediction..."
          python src/predict_and_notify.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update prediction and logs [skip ci]" && git push)
