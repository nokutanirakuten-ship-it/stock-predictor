name: Stock Prediction & Verification Schedule

on:
  schedule:
    # 日本時間 朝7:00 (UTC 22:00) 月〜金
    - cron: '0 22 * * 0-4'
    # 日本時間 夕方16:00 (UTC 7:00) 月〜金
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-tasks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python based on time
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: |
          # UTC時間を取得して朝か夕かを判定
          CURRENT_HOUR=$(date -u +%H)
          echo "Current UTC hour: $CURRENT_HOUR"
          
          if [ "$CURRENT_HOUR" -eq 22 ]; then
            echo "Running morning prediction..."
            python src/predict_and_notify.py
          elif [ "$CURRENT_HOUR" -eq 7 ]; then
            echo "Running evening verification..."
            python src/verify_and_notify.py
          else
            echo "Manual or off-schedule run, running prediction as default."
            python src/predict_and_notify.py
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update prediction and logs [skip ci]" && git push)
